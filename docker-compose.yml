services:
  backend:
    build: ./monitoring_app
    container_name: monitoring-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000" # Exponera till host
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    ports:
      - "3000:80" # Exponera till host för serverns nginx
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
